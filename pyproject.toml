[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "safewatch"
version = "0.1.0"
description = "AI 기반 위험상황 탐지 및 CCTV 관제 지원 시스템 (prototype)"
requires-python = ">=3.10"
dependencies = [
  "numpy>=2.0,<2.3",
  "opencv-python==4.12.0.88",
  "PyYAML==6.0.3",
  "fastapi==0.142.2",
  "uvicorn[standard]==0.54.0",
  "imageio-ffmpeg==0.6.0",
]

[project.optional-dependencies]
vision = ["ultralytics==8.4.171", "torch==2.14.1", "torchvision==0.29.1"]
dev = ["pytest==9.1.1", "httpx==0.28.1"]

[project.scripts]
safewatch = "safewatch.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
safewatch = ["server/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
